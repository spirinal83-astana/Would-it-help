<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>От тревоги — к ясности</title><style>
:root{--bg:#f5f4ef;--card:#fff;--text:#202522;--muted:#68706b;--line:#dedfd9;--accent:#315f54;--soft:#e8efec;--warn:#fff5e9}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}main{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 40px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);min-height:30px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;margin:auto 0;box-shadow:0 8px 30px rgba(0,0,0,.04)}h1{font-size:30px;line-height:1.12;margin:0 0 18px}h2{font-size:23px;line-height:1.25;margin:0 0 16px}p{font-size:17px;line-height:1.52;margin:10px 0;color:#353b37}.muted{color:var(--muted);font-size:14px}.buttons{display:grid;gap:10px;margin-top:24px}button,.linkbtn{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:650;cursor:pointer;background:var(--accent);color:white;text-align:center;text-decoration:none}.secondary{background:var(--soft);color:var(--text)}.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.danger{background:#6d3d3d}.note{background:var(--soft);border-radius:15px;padding:14px 15px;margin:14px 0}.warn{background:var(--warn)}.footer{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.4}.mini{border:0;background:none;color:var(--muted);padding:6px;width:auto;font-size:13px}.progress{height:4px;background:#e5e5df;border-radius:5px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--accent)}@media(min-width:700px){main{padding-top:40px}.card{padding:38px}}
</style></head><body><main><div class='top'><span id='brand'>От тревоги — к ясности</span><button class='mini' id='restart' onclick='go("start")'>Начать заново</button></div><div class='progress'><i id='bar'></i></div><section class='card' id='app'></section></main><script>
const screens={
consent:{title:'Перед началом',body:`<p>Это приложение предоставляет структурированный алгоритм для самостоятельного разбора тревожащей ситуации.</p><p>Оно не диагностирует психические расстройства, не заменяет психологическую, психотерапевтическую или медицинскую помощь и не предназначено для экстренных ситуаций.</p><p><b>Содержание вашей ситуации не требуется вводить в приложение.</b></p><p class="muted">Прототип v0.1. Условия использования и политика конфиденциальности требуют юридической проверки перед публичным запуском.</p>`,buttons:[['Я понимаю и хочу продолжить','accept']]},
start:{title:'Вам тревожно?',body:`<p>Пройдите несколько простых шагов, чтобы самостоятельно разобраться в том, что вас сейчас беспокоит.</p><p><b>Вам не нужно ничего описывать или вводить в приложение.</b></p><div class="footer">Этот инструмент не предназначен для экстренных ситуаций.</div>`,buttons:[['Начать','safety']]},
safety:{title:'Важно',body:`<p>Этот алгоритм не предназначен для ситуаций, связанных с намерением причинить вред себе или другому человеку.</p><p>Если это относится к вашей ситуации, не используйте алгоритм для поиска решения или планирования дальнейших действий.</p>`,buttons:[['Продолжить','paper'],['Эта ситуация выходит за рамки алгоритма','safetyStop','danger']]},
safetyStop:{title:'Эта ситуация выходит за рамки этого алгоритма',body:`<p>Если вы чувствуете, что можете причинить вред себе или другому человеку, не продолжайте этот алгоритм.</p><p>Обратитесь за непосредственной помощью к человеку, которому доверяете, квалифицированному специалисту или в доступную вам экстренную службу.</p><div class="note warn"><b>Не оставайтесь с этой ситуацией один на один.</b></div>`,buttons:[['Завершить','start']]},
paper:{title:'Можно просто подумать. А можно записать.',body:`<p>Вы можете отвечать на следующие вопросы мысленно.</p><p>Но иногда полезно записывать ответы — так проще отделить факты от предположений и увидеть ситуацию более структурированно.</p><p>Можно использовать обычный лист бумаги или наш готовый бланк.</p>`,buttons:[['Продолжить','cause'],['Открыть бланк','worksheet','ghost']]},
cause:{title:'Вы понимаете, что именно сейчас вызывает у вас тревогу?',body:'',buttons:[['Да','situation'],['Примерно','situation'],['Нет','unknown']]},
unknown:{title:'Сейчас вам трудно определить причину тревоги',body:`<p>Не обязательно искать её прямо сейчас.</p><p>Этот алгоритм предназначен для ситуаций, когда можно хотя бы примерно определить, что именно вас беспокоит. Вы можете вернуться к нему позже.</p><div class="note">Если сильная тревога регулярно возникает без понятной причины, повторяется или заметно влияет на вашу обычную жизнь, стоит рассмотреть возможность обсудить своё состояние с квалифицированным специалистом.</div>`,buttons:[['Завершить','start']]},
situation:{title:'Что именно вас сейчас тревожит?',body:`<p>Сформулируйте это <b>для себя</b> одной простой фразой.</p><p>Не вводите ответ в приложение. Если используете бланк — запишите его.</p>`,buttons:[['Готово','outcome']]},
outcome:{title:'А чего именно вы опасаетесь?',body:`<p>Постарайтесь определить <b>конкретный исход</b>, который вызывает тревогу.</p><p>Сформулируйте его для себя или запишите на бланке.</p>`,buttons:[['Готово','occurred']]},
occurred:{title:'Этот исход уже наступил?',body:'',buttons:[['Да','control'],['Нет','facts']]},
facts:{title:'Что вы точно знаете?',body:`<p>Подумайте только о <b>фактах</b>, известных вам на данный момент.</p><p>Пока не добавляйте прогнозы, догадки и возможные последствия. Если используете бланк — запишите их.</p>`,buttons:[['Готово','assumptions']]},
assumptions:{title:'А что вы предполагаете?',body:`<p>Теперь отдельно подумайте о том, что вы предполагаете, ожидаете или прогнозируете, но <b>пока не знаете наверняка</b>.</p>`,buttons:[['Готово','for']]},
for:{title:'Вернитесь к исходу, которого вы опасаетесь',body:`<p>Есть ли среди известных вам <b>фактов</b> основания считать, что этот исход может произойти?</p>`,buttons:[['Да, есть','against'],['Есть некоторые','against'],['Нет','against'],['Не могу определить','against']]},
against:{title:'Теперь посмотрите с другой стороны',body:`<p>Есть ли известные вам факты, которые <b>не подтверждают этот исход</b> или указывают на другие возможные варианты?</p>`,buttons:[['Да','alternatives'],['Нет','alternatives'],['Не могу определить','alternatives']]},
alternatives:{title:'Возможны ли другие варианты?',body:`<p>Не обязательно искать хороший исход.</p><p>Просто подумайте, существуют ли <b>другие реалистичные варианты развития ситуации</b>, кроме того, которого вы опасаетесь.</p>`,buttons:[['Да','would'],['Нет','would'],['Не знаю','would']]},
would:{title:'Остановитесь на секунду.',body:`<p>Вы уже посмотрели на факты, предположения и возможные варианты.</p><h2>Если я продолжу тревожиться об этом прямо сейчас — это поможет изменить ситуацию?</h2>`,buttons:[['Да','principle'],['Нет','principle'],['Не уверен','principle']]},
principle:{title:'Полезная мысль',body:`<p>Тревога может обратить наше внимание на возможную проблему.</p><p>Но после того как проблема замечена, сама тревога не всегда помогает её решить. Иногда дальнейшее прокручивание ситуации создаёт больше хаоса, чем ясности.</p><h2>Есть ли что-то, что я действительно могу сделать?</h2>`,buttons:[['Продолжить','control']]},
control:{title:'Можете ли вы повлиять на ситуацию?',body:'',buttons:[['Да','own'],['Частично','own'],['Нет','noControl']]},
own:{title:'Отделите результат от своих действий',body:`<p>Возможно, вы не можете полностью контролировать, <b>чем закончится ситуация</b>.</p><p>Подумайте только о том, что действительно можете сделать <b>со своей стороны</b>. Если используете бланк — запишите это.</p>`,buttons:[['Готово','now']]},
now:{title:'Нужно ли вам что-нибудь делать прямо сейчас?',body:'',buttons:[['Да','action'],['Нет','later'],['Не уверен','unsure']]},
action:{title:'Один следующий шаг',body:`<p>Не пытайтесь решить всю проблему сразу.</p><p>Определите для себя <b>одно безопасное конкретное действие</b>, которое действительно находится под вашим контролем.</p><p>Оно не должно причинять вред вам или другим людям.</p>`,buttons:[['Я определил действие','enough']]},
later:{title:'Сейчас действий не требуется',body:`<p>Определите, <b>когда или при каком условии</b> действительно потребуется вернуться к этому вопросу.</p><p>Вопрос не забыт. Просто сейчас его не нужно решать.</p>`,buttons:[['Готово','enough']]},
unsure:{title:'Один дополнительный вопрос',body:`<p>Если вы ничего не сделаете с этим <b>сейчас</b>, может ли это заметно ухудшить ситуацию?</p>`,buttons:[['Да','action'],['Нет','later'],['Всё ещё не знаю','uncertain']]},
uncertain:{title:'Не каждое решение нужно принимать немедленно',body:`<p>Сейчас можно признать неопределённость и вернуться к вопросу, когда появится новая информация.</p>`,buttons:[['Продолжить','enough']]},
noControl:{title:'Сейчас это не находится под вашим контролем',body:`<p>Это не означает, что ситуация не важна.</p><p>Это означает только то, что <b>прямо сейчас у вас нет действия, которое может изменить её исход.</b></p>`,buttons:[['Продолжить','ruminate']]},
ruminate:{title:'Спросите себя',body:`<p>Если сейчас нет действия, которое может изменить ситуацию, даст ли дальнейшее прокручивание её в голове новую полезную информацию?</p>`,buttons:[['Скорее нет','enough'],['Мне всё равно трудно остановиться','stopThinking']]},
stopThinking:{title:'На уровне размышления вы уже сделали достаточно',body:`<p>Вы рассмотрели ситуацию, отделили факты от предположений и определили границы своего контроля.</p><p>Дополнительные размышления сейчас могут просто повторять уже пройденный круг.</p><p>Попробуйте переключить внимание с <b>решения ситуации</b> на своё текущее состояние.</p>`,buttons:[['Продолжить','enough']]},
enough:{title:'На этом достаточно',body:`<p>Вы уже рассмотрели ситуацию настолько, насколько это возможно сейчас.</p><p>Если вы определили действие — сосредоточьтесь на нём.</p><p>Если действий сейчас нет — позвольте себе вернуться к другим делам.</p><p><b>Не обязательно продолжать искать ответ прямо сейчас.</b></p>`,buttons:[['Продолжить','clarity']]},
clarity:{title:'Стало ли вам понятнее, что делать дальше?',body:'',buttons:[['Да','final'],['Частично','partial'],['Нет','noClarity']]},
partial:{title:'Не обязательно получить все ответы сразу',body:`<p>Если вам стало понятнее хотя бы то, <b>что находится под вашим контролем</b>, этого может быть достаточно для текущего момента.</p>`,buttons:[['Продолжить','final']]},
noClarity:{title:'Не на каждую ситуацию можно найти ответ сразу',body:`<p>Возможно, сейчас недостаточно информации или ситуация действительно остаётся неопределённой.</p><p>Это не означает, что её нужно анализировать снова и снова.</p>`,buttons:[['Продолжить','final']]},
final:{title:'Не каждая мысль требует решения.',body:`<p>Если тревога часто повторяется, становится трудно управляемой или заметно влияет на сон, работу, отношения или обычную жизнь, этого инструмента может быть недостаточно.</p><p>В таком случае стоит рассмотреть возможность обсудить своё состояние с квалифицированным специалистом.</p><div class="note"><b>Сосредоточьтесь на том, что находится под вашим контролем.</b></div>`,buttons:[['Завершить','start']]}
};
const order=Object.keys(screens);let current='start';
function logEvent(name){try{const logs=JSON.parse(localStorage.getItem('prototype_logs')||'[]');logs.push({event:name,ts:new Date().toISOString(),session:sessionStorage.getItem('sid')||''});localStorage.setItem('prototype_logs',JSON.stringify(logs.slice(-300)))}catch(e){}}
function accept(){localStorage.setItem('consent_v','0.1');localStorage.setItem('consent_at',new Date().toISOString());go('start')}
function go(id){if(id==='worksheet'){window.open('worksheet.pdf','_blank');logEvent('worksheet_opened');return}if(id==='start'){sessionStorage.setItem('sid',crypto.randomUUID?crypto.randomUUID():String(Date.now()));logEvent('session_started')}if(id==='safetyStop')logEvent('safety_exit');if(id==='final')logEvent('final_reached');current=id;render();window.scrollTo(0,0)}
function render(){const s=screens[current];document.getElementById('app').innerHTML=`<h1>${s.title}</h1>${s.body}<div class="buttons">${s.buttons.map(b=>`<button class="${b[2]||''}" onclick="${b[1]==='accept'?'accept()':`go('${b[1]}')`}">${b[0]}</button>`).join('')}</div>`;const idx=Math.max(0,order.indexOf(current));document.getElementById('bar').style.width=Math.min(100,Math.round(idx/order.length*100))+'%';document.getElementById('restart').style.visibility=current==='consent'?'hidden':'visible'}
if(!localStorage.getItem('consent_v')) current='consent'; else current='start';render();
</script></body></html>
